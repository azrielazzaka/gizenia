<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba GIZENIA AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 font-sans text-gray-800">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-200">
        <div class="flex items-center mb-6">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl mr-4">🤖</div>
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Simulator AI GIZENIA</h1>
                <p class="text-sm text-gray-500">Uji coba algoritma K-Nearest Neighbors (KNN)</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6 bg-gray-50 p-4 rounded-xl">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Target Kalori (kkal)</label>
                <input type="number" id="tCal" value="200" class="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Target Protein (g)</label>
                <input type="number" id="tPro" value="20" class="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Target Lemak (g)</label>
                <input type="number" id="tFat" value="5" class="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Target Karbo (g)</label>
                <input type="number" id="tCarbs" value="10" class="w-full p-2 border rounded focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
        </div>

        <button onclick="mintaRekomendasi()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-emerald-700 transition">
            Tanya AI Sekarang!
        </button>

        <div class="mt-8 border-t pt-6">
            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wide mb-4">Jawaban AI (Top 3):</h3>
            <div id="hasilLoading" class="hidden text-center text-emerald-500 font-bold animate-pulse">AI sedang berpikir...</div>
            <ul id="hasilBox" class="space-y-3">
                <li class="text-center text-gray-400 text-sm">Belum ada data. Silakan klik tombol di atas.</li>
            </ul>
        </div>
    </div>

    <script>
        async function mintaRekomendasi() {
            document.getElementById('hasilBox').innerHTML = '';
            document.getElementById('hasilLoading').classList.remove('hidden');

            const payload = {
                target_calories: parseFloat(document.getElementById('tCal').value),
                target_protein: parseFloat(document.getElementById('tPro').value),
                target_fat: parseFloat(document.getElementById('tFat').value),
                target_carbs: parseFloat(document.getElementById('tCarbs').value)
            };

            try {
                // Mengirim request POST ke Flask
                const res = await fetch('http://127.0.0.1:5000/api/predict/recommendation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                document.getElementById('hasilLoading').classList.add('hidden');
                
                const box = document.getElementById('hasilBox');
                if(data.status === 'success') {
                    data.rekomendasi.forEach((menu, index) => {
                        let badgeColor = menu.match_score > 90 ? 'bg-emerald-100 text-emerald-700' : 'bg-yellow-100 text-yellow-700';
                        box.innerHTML += `
                            <li class="p-4 border rounded-xl flex justify-between items-center bg-white shadow-sm">
                                <div>
                                    <span class="text-xs font-bold text-gray-400">#${index + 1}</span>
                                    <h4 class="font-bold text-gray-900 text-lg">${menu.name}</h4>
                                    <p class="text-xs text-gray-500 mt-1">${menu.calories} kkal | ${menu.protein}g Protein | ${menu.serving_size_g}g per porsi</p>
                                </div>
                                <div class="text-right">
                                    <span class="px-3 py-1 rounded-full text-xs font-bold ${badgeColor}">Cocok: ${menu.match_score}%</span>
                                </div>
                            </li>
                        `;
                    });
                }
            } catch(e) {
                document.getElementById('hasilLoading').classList.add('hidden');
                document.getElementById('hasilBox').innerHTML = `<li class="text-red-500 font-bold text-center">Gagal terhubung ke AI Flask! Pastikan server menyala.</li>`;
            }
        }
    </script>
</body>
</html>
